name = "edgepulse"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare KV binding for persistent storage
# To create KV: npx wrangler kv:namespace create "BOT_KV"
# Then replace the id below with your assigned KV namespace ID
[[kv_namespaces]]
binding = "BOT_KV"
id = "YOUR_KV_NAMESPACE_ID"
# preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID"

# Cron triggers for background tasks (periodic cleanups, health checks)
[triggers]
crons = ["*/5 * * * *"]

# Optional variables (Can also be set dynamically via web onboarding at /setup)
[vars]
# BOT_TOKEN = ""
# UPSTASH_URL = ""
# UPSTASH_TOKEN = ""
